bt_navigator_navigate_to_pose_rclcpp_node:  # Navigate-to-pose BT action helper node.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Use simulation time for the NavigateToPose action helper node.
    use_sim_time: false  # Uses Gazebo simulation clock when true.


controller_server:  # Nav2 controller server configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Controller loop rate, velocity deadbands, failure tolerance, and selected controller/checker plugins.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    controller_frequency: 20.0  # Controller loop frequency in Hz.
    min_x_velocity_threshold: 0.001  # Small x velocities below this are treated as zero.
    min_y_velocity_threshold: 0.001 # Small y velocities below this are treated as zero.
    min_theta_velocity_threshold: 0.001  # Small angular velocities below this are treated as zero.
    failure_tolerance: 0.3  # Allowed controller failure time before navigation aborts.
    progress_checker_plugin: "progress_checker"  # Selected progress checker plugin ID.
    goal_checker_plugins: ["general_goal_checker"]  # Goal checker plugin IDs; precise checker is available as an optional alternative.
    controller_plugins: ["FollowPath"]  # Controller plugin IDs loaded by controller server.

    # Progress checker parameters
    progress_checker:  # Progress checker plugin parameter namespace.
      # Count either translation or rotation as progress. This prevents slow
      # in-place turns toward an intermediate pose from being treated as stuck.
      plugin: "nav2_controller::PoseProgressChecker"  # Plugin class name loaded for this component.
      required_movement_radius: 0.20  # Minimum movement radius required to show progress.
      required_movement_angle: 0.35  # Minimum rotation in radians required to show progress.
      movement_time_allowance: 30.0  # Time allowed to show translation or rotation progress.
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True

    general_goal_checker:  # General goal checker plugin parameter namespace.
      # Goal is reached when pose error is inside these xy/yaw tolerances.
      stateful: True  # Keeps checker/planner state between control cycles.
      plugin: "nav2_controller::SimpleGoalChecker"  # Plugin class name loaded for this component.
      xy_goal_tolerance: 0.20  # Allowed final xy position error in meters.
      yaw_goal_tolerance: 0.50  # Allowed final yaw error in radians.

    # DWB parameters
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # Correct ROS 2 Humble format
      primary_controller: "dwb_core::DWBLocalPlanner"

      angular_dist_threshold: 2.0944
      angular_disengage_threshold: 1.5708
      forward_sampling_distance: 0.35

      rotate_to_heading_angular_vel: 0.22
      max_angular_accel: 0.30
      simulate_ahead_time: 1.0

      rotate_to_goal_heading: false
      closed_loop: true
 
      debug_trajectory_details: true  # Publishes detailed DWB trajectory debug information.
      min_vel_x: 0.0  # Minimum sampled forward velocity.
      min_vel_y: 0.0  # Minimum sampled lateral velocity.
      max_vel_x: 0.4  # Maximum forward velocity command.
      max_vel_y: 0.0  # Maximum lateral velocity command.
      max_vel_theta: 0.25 # Maximum angular velocity command.
      min_speed_xy: 0.0  # Minimum translational speed magnitude.
      max_speed_xy: 0.4  # Maximum translational speed magnitude.
      min_speed_theta: 0.0  # Minimum angular speed magnitude.
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.3 # Maximum x acceleration.
      acc_lim_y: 0.0  # Maximum y acceleration.
      acc_lim_theta: 0.4 # Maximum angular acceleration.
      decel_lim_x: -0.3  # Maximum x deceleration, usually negative.
      decel_lim_y: 0.0  # Maximum y deceleration, usually negative.
      decel_lim_theta: -0.4  # Maximum angular deceleration, usually negative.
      vx_samples: 20  # Number of x velocity samples evaluated by DWB.
      vy_samples: 5  # Number of y velocity samples evaluated by DWB.
      vtheta_samples: 20  # Number of angular velocity samples evaluated by DWB.
      sim_time: 1.7 # Forward simulation time for trajectory rollout.
      linear_granularity: 0.05  # Linear step size for trajectory collision checking.
      angular_granularity: 0.025  # Angular step size for trajectory collision checking.
      transform_tolerance: 0.2  # Allowed transform timestamp tolerance in seconds.
      xy_goal_tolerance: 0.25  # Allowed final xy position error in meters.
      trans_stopped_velocity: 0.05  # Velocity below which robot is considered translationally stopped.
      short_circuit_trajectory_evaluation: True  # Stops critic evaluation once a trajectory is already invalid/worse.
      stateful: True  # Keeps checker/planner state between control cycles.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]  # Ordered list of DWB trajectory critics.
      ObstacleFootprint.scale: 1.0  # Weight for footprint-aware obstacle-cost critic.
      PathAlign.scale: 8.0  # Weight for aligning robot heading with path.
      PathAlign.forward_point_distance: 0.20  # Forward point distance used by path-alignment critic.
      GoalAlign.scale: 6.0  # Weight for aligning robot heading with goal direction.
      GoalAlign.forward_point_distance: 0.20  # Forward point distance used by goal-alignment critic.
      PathDist.scale: 24.0  # Weight for staying close to global path.
      GoalDist.scale: 24.0  # Weight for reducing distance to goal.
      RotateToGoal.scale: 5.0  # Weight for final rotate-to-goal behavior.
      RotateToGoal.slowing_factor: 8.0  # Slowing factor while rotating to goal heading.
      RotateToGoal.lookahead_time: -1.0  # Lookahead time for rotate-to-goal critic; negative disables lookahead.


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      # min_obstacle_height: 0.0
      # max_obstacle_height: 0.

      footprint: "[[0.25, 0.146], [0.25, -0.146], [-0.09, -0.146], [-0.09, 0.146]]"
      footprint_padding: 0.03

      plugins:
      - obstacle_layer
      - denoise_layer
      - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          expected_update_rate: 0.50

          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          expected_update_rate: 0.30
          observation_persistence: 0.30

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

      track_unknown_space: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: odom
      robot_base_frame: base_link

      footprint: "[[0.25, 0.146], [0.25, -0.146], [-0.09, -0.146], [-0.09, 0.146]]"
      footprint_padding: 0.03

      resolution: 0.05
      track_unknown_space: false

      plugins:
      - obstacle_layer
      - denoise_layer
      - inflation_layer
      obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          footprint_clearing_enabled: true
          observation_sources: scan

          scan:
            topic: /scan
            data_type: "LaserScan"

            marking: true
            clearing: true
            inf_is_valid: true
            obstacle_min_range: 0.0
            obstacle_max_range: 5.0
            raytrace_min_range: 0.0
            raytrace_max_range: 6.0
            expected_update_rate: 0.30
            observation_persistence: 0.30


      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 5.0

      always_send_full_costmap: true


      rolling_window: true
      width: 15
      height: 15
      # Centre the initial rolling window on the odom origin. Without explicit
      # origins, the costmap starts at (0, 0), placing sensors with a small
      # negative offset outside its bounds until the first successful recenter.
      origin_x: -15.0
      origin_y: -15.0
      
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.50
      use_astar: false
      allow_unknown: false


smoother_server:  # Path smoother server configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Path smoother plugin selection and convergence/refinement settings.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    smoother_plugins: ["simple_smoother"]  # Path smoother plugin IDs.
    simple_smoother:  # Simple smoother plugin namespace.
      # Simple smoother tolerance, iteration budget, and refinement toggle.
      plugin: "nav2_smoother::SimpleSmoother"  # Plugin class name loaded for this component.
      tolerance: 1.0e-10  # Convergence tolerance used by the path smoother.
      max_its: 1000  # Maximum smoothing iterations.
      do_refinement: True  # Runs extra smoothing refinement when true.

behavior_server:  # Recovery and behavior server configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Recovery/behavior server topics, cycle rate, plugin list, frames, and velocity limits.
    costmap_topic: local_costmap/costmap_raw  # Local costmap topic used by behavior server.
    footprint_topic: local_costmap/published_footprint  # Robot footprint topic used by behavior server.
    cycle_frequency: 10.0  # Behavior server update frequency in Hz.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # Behavior plugin IDs loaded by behavior server.
    spin:  # Spin behavior namespace.
      # Rotate in place recovery behavior.
      plugin: "nav2_behaviors/Spin"  # Plugin class name loaded for this component.
    backup:
      plugin: "nav2_behaviors/BackUp"
      acceleration_limit: 0.30
      deceleration_limit: -0.30
      minimum_speed: 0.05
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      acceleration_limit: 0.30
      deceleration_limit: -0.30
      minimum_speed: 0.05
    wait:  # Wait behavior namespace.
      # Pause behavior used by recovery trees and waypoints.
      plugin: "nav2_behaviors/Wait"  # Plugin class name loaded for this component.
    assisted_teleop:  # Assisted teleoperation behavior namespace.
      # Assisted teleoperation behavior with collision checking.
      plugin: "nav2_behaviors/AssistedTeleop"  # Plugin class name loaded for this component.
    global_frame: odom  # Global planning or behavior frame.
    robot_base_frame: base_link  # Robot base frame used by Nav2.
    transform_tolerance: 0.1  # Allowed transform timestamp tolerance in seconds.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    simulate_ahead_time: 2.0  # Time horizon used to collision-check behaviors.
    max_rotational_vel: 1.0  # Maximum rotational velocity for behaviors.
    min_rotational_vel: 0.4  # Minimum rotational velocity for behaviors.
    rotational_acc_lim: 3.2  # Rotational acceleration limit for behaviors.

robot_state_publisher:  # Robot state publisher node configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Use simulation time for robot_state_publisher timestamps.
    use_sim_time: false  # Uses Gazebo simulation clock when true.

waypoint_follower:  # Waypoint follower node configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Waypoint follower clock, loop rate, failure policy, and task executor plugin.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    loop_rate: 20  # Waypoint follower loop rate in Hz.
    stop_on_failure: true  # Stops waypoint execution if a waypoint fails.
    waypoint_task_executor_plugin: "wait_at_waypoint"  # Task executor plugin used at each waypoint.
    wait_at_waypoint:  # Wait-at-waypoint task executor namespace.
      # Wait task run at each waypoint and pause duration in milliseconds.
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # Plugin class name loaded for this component.
      enabled: True  # Enables this plugin or behavior when true.
      waypoint_pause_duration: 200  # Pause duration at waypoint in milliseconds.

velocity_smoother:  # Velocity smoother node configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Smooths cmd_vel output using configured velocity/acceleration limits and odometry feedback.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    smoothing_frequency: 20.0  # Velocity smoother output frequency in Hz.
    scale_velocities: False  # Scales velocity vector to preserve direction when limiting.
    feedback: "OPEN_LOOP"  # Velocity smoother feedback mode.
    max_velocity: [0.4, 0.0, 0.25]
    min_velocity: [-0.4, 0.0, -0.25]
    max_accel: [0.3, 0.0, 0.4]
    max_decel: [-0.3, 0.0, -0.4]
    odom_topic: "/odometry/filtered"  # Odometry topic consumed by Nav2.
    odom_duration: 0.1  # Recent odometry time window used by smoother.
    deadband_velocity: [0.0, 0.0, 0.0]  # Velocity components below these values are zeroed.
    velocity_timeout: 1.0  # Stops output after this many seconds without commands.
  
