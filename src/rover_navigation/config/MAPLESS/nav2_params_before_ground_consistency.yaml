bt_navigator_navigate_through_poses_rclcpp_node:  # Navigate-through-poses BT action helper node.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Use simulation time for the NavigateThroughPoses action helper node.
    use_sim_time: false  # Uses Gazebo simulation clock when true.

bt_navigator_navigate_to_pose_rclcpp_node:  # Navigate-to-pose BT action helper node.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Use simulation time for the NavigateToPose action helper node.
    use_sim_time: false  # Uses Gazebo simulation clock when true.

controller_server:  # Nav2 controller server configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Controller loop rate, velocity deadbands, failure tolerance, and selected controller/checker plugins.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    controller_frequency: 20.0  # Controller loop frequency in Hz.
    min_x_velocity_threshold: 0.001  # Small x velocities below this are treated as zero.
    min_y_velocity_threshold: 0.001 # Small y velocities below this are treated as zero.
    min_theta_velocity_threshold: 0.001  # Small angular velocities below this are treated as zero.
    failure_tolerance: 0.3  # Allowed controller failure time before navigation aborts.
    progress_checker_plugin: "progress_checker"  # Selected progress checker plugin ID.
    goal_checker_plugins: ["general_goal_checker"]  # Goal checker plugin IDs; precise checker is available as an optional alternative.
    controller_plugins: ["FollowPath"]  # Controller plugin IDs loaded by controller server.

    # Progress checker parameters
    progress_checker:  # Progress checker plugin parameter namespace.
      # Count either translation or rotation as progress. This prevents slow
      # in-place turns toward an intermediate pose from being treated as stuck.
      plugin: "nav2_controller::PoseProgressChecker"  # Plugin class name loaded for this component.
      required_movement_radius: 0.05  # Minimum movement radius required to show progress.
      required_movement_angle: 0.10  # Minimum rotation in radians required to show progress.
      movement_time_allowance: 30.0  # Time allowed to show translation or rotation progress.
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True

    general_goal_checker:  # General goal checker plugin parameter namespace.
      # Goal is reached when pose error is inside these xy/yaw tolerances.
      stateful: True  # Keeps checker/planner state between control cycles.
      plugin: "nav2_controller::SimpleGoalChecker"  # Plugin class name loaded for this component.
      xy_goal_tolerance: 0.20  # Allowed final xy position error in meters.
      yaw_goal_tolerance: 0.50  # Allowed final yaw error in radians.

    # DWB parameters
    FollowPath:  # DWB local planner plugin namespace.
      # DWB local planner velocity limits, acceleration limits, sampling density, and trajectory critics.
      plugin: "dwb_core::DWBLocalPlanner"  # Plugin class name loaded for this component.
      debug_trajectory_details: true  # Publishes detailed DWB trajectory debug information.
      min_vel_x: 0.0  # Minimum sampled forward velocity.
      min_vel_y: 0.0  # Minimum sampled lateral velocity.
      max_vel_x: 0.6  # Maximum forward velocity command.
      max_vel_y: 0.0  # Maximum lateral velocity command.
      max_vel_theta: 0.25 # Maximum angular velocity command.
      min_speed_xy: 0.0  # Minimum translational speed magnitude.
      max_speed_xy: 0.50  # Maximum translational speed magnitude.
      min_speed_theta: 0.0  # Minimum angular speed magnitude.
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.6  # Maximum x acceleration.
      acc_lim_y: 0.0  # Maximum y acceleration.
      acc_lim_theta: 0.4 # Maximum angular acceleration.
      decel_lim_x: -0.6  # Maximum x deceleration, usually negative.
      decel_lim_y: 0.0  # Maximum y deceleration, usually negative.
      decel_lim_theta: -0.4  # Maximum angular deceleration, usually negative.
      vx_samples: 20  # Number of x velocity samples evaluated by DWB.
      vy_samples: 5  # Number of y velocity samples evaluated by DWB.
      vtheta_samples: 20  # Number of angular velocity samples evaluated by DWB.
      sim_time: 1.7 # Forward simulation time for trajectory rollout.
      linear_granularity: 0.05  # Linear step size for trajectory collision checking.
      angular_granularity: 0.025  # Angular step size for trajectory collision checking.
      transform_tolerance: 0.2  # Allowed transform timestamp tolerance in seconds.
      xy_goal_tolerance: 0.25  # Allowed final xy position error in meters.
      trans_stopped_velocity: 0.05  # Velocity below which robot is considered translationally stopped.
      short_circuit_trajectory_evaluation: True  # Stops critic evaluation once a trajectory is already invalid/worse.
      stateful: True  # Keeps checker/planner state between control cycles.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]  # Ordered list of DWB trajectory critics.
      BaseObstacle.scale: 0.02  # Weight for obstacle-cost critic.
      PathAlign.scale: 8.0  # Weight for aligning robot heading with path.
      PathAlign.forward_point_distance: 0.20  # Forward point distance used by path-alignment critic.
      GoalAlign.scale: 6.0  # Weight for aligning robot heading with goal direction.
      GoalAlign.forward_point_distance: 0.20  # Forward point distance used by goal-alignment critic.
      PathDist.scale: 24.0  # Weight for staying close to global path.
      GoalDist.scale: 24.0  # Weight for reducing distance to goal.
      RotateToGoal.scale: 5.0  # Weight for final rotate-to-goal behavior.
      RotateToGoal.slowing_factor: 8.0  # Slowing factor while rotating to goal heading.
      RotateToGoal.lookahead_time: -1.0  # Lookahead time for rotate-to-goal critic; negative disables lookahead.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # min_obstacle_height: 0.0
      # max_obstacle_height: 0.

      footprint: "[[0.20, 0.19], [0.20, -0.19], [-0.20, -0.19], [-0.20, 0.19]]"
      footprint_padding: 0.04

      plugins:
        - obstacle_layer
        - denoise_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.23
        cost_scaling_factor: 10.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      footprint: "[[0.20, 0.19], [0.20, -0.19], [-0.20, -0.19], [-0.20, 0.19]]"
      footprint_padding: 0.04

      resolution: 0.05
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - denoise_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_min_range: 0.10
          obstacle_max_range: 5.0
          raytrace_min_range: 0.10
          raytrace_max_range: 6.0

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 5.0

      always_send_full_costmap: true


map_server:  # Map server node configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Map server clock source and map yaml path; launch can override yaml_filename.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""  # Occupancy grid YAML file loaded by map_server.

map_saver:  # Map saver node configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Map saver clock source, save timeout, occupancy thresholds, and transient map subscription.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    save_map_timeout: 5.0  # Maximum time allowed for map saving in seconds.
    free_thresh_default: 0.25  # Default free-space threshold for saved maps.
    occupied_thresh_default: 0.65  # Default occupied threshold for saved maps.
    map_subscribe_transient_local: True  # Uses transient local QoS for latched map data.

