# Overrides applied after nav2_params.yaml by nav2_mapless_launch.py.
# Mapless navigation is odom-relative: goals move with accumulated odometry
# drift and are limited to the rolling global costmap window.

bt_navigator:
  ros__parameters:
    global_frame: odom

controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.20
      max_speed_xy: 0.20
      max_vel_theta: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.10
      inflation_layer:
        inflation_radius: 0.24
        cost_scaling_factor: 8.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      rolling_window: true
      # Nav2 Humble declares these parameters as integers.
      width: 8
      height: 8
      resolution: 0.05
      track_unknown_space: false

      # No static layer: this costmap is built only from live observations.
      plugins:
        - obstacle_layer
        - denoise_layer
        - inflation_layer

        

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 0.20]
    min_velocity: [-0.20, 0.0, -0.20]
