ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    # publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom

    # odom0_config: [
    #   true,  true,  false,
    #   false, false, true,
    #   true,  true,  false,
    #   false, false, true,
    #   false, false, false
    # ]

    imu0: /livox/imu_si

    # imu0_config: [
    #   false, false, false,   # x, y, z position
    #   false, false, false,   # roll, pitch, yaw orientation
    #   false, false, false,   # vx, vy, vz linear velocity
    #   false, false, true,    # vroll, vpitch, vyaw angular velocity
    #   false, false, false    # ax, ay, az linear acceleration
    # ]
    

    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, true
    ]

    imu0_remove_gravitational_acceleration: false
    publish_tf: true
