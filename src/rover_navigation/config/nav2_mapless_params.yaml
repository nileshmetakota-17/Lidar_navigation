bt_navigator:  # Nav2 behavior-tree navigator configuration.
  ros__parameters:  # ROS 2 parameter block for this node.
    # Behavior Tree navigator frames, odometry input, timing, and available BT node plugins.
    use_sim_time: false  # Uses Gazebo simulation clock when true.
    global_frame: odom # Global planning or behavior frame.
    robot_base_frame: base_link  # Robot base frame used by Nav2.
    odom_topic: /odometry/filtered  # Odometry topic consumed by Nav2.
    bt_loop_duration: 10  # Behavior tree tick period in milliseconds.
    default_server_timeout: 20  # Default action/service timeout in seconds.
    wait_for_service_timeout: 1000  # Service wait timeout in milliseconds.
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:  # Behavior-tree plugin libraries loaded by Nav2.
